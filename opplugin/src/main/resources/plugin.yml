name: OpServer
version: 1.0.0
main: at.minich.opserver.OpServerPlugin
api-version: '1.21'
depend: [Vault]

commands:
  bal:
    description: Show your or another player's balance.
    usage: /bal [player]
    aliases: [balance, money]
  baltop:
    description: Show the top 10 richest players.
    usage: /baltop
  pay:
    description: Pay another player coins.
    usage: /pay <player> <amount>
  bank:
    description: Öffnet das Bank-GUI. Verwalte bis zu 5 Bankkonten.
    usage: /bank [balance]
  salary:
    description: Öffnet das Lohn-GUI mit deinen Verdienstinfos.
    usage: /salary
  lohn:
    description: Öffnet das Lohn-GUI mit deinen Verdienstinfos.
    usage: /lohn
  lohnfarm:
    description: Teleportiert dich zur Lohnfarm (3x Lohn-Bonus).
    usage: /lohnfarm
  giveitem:
    description: Give a custom item to a player.
    usage: /giveitem <player> <item>
    permission: opserver.giveitem
  giveabilityitem:
    description: Gibt einem Spieler ein Ability Item (fly/heal/speed/god).
    usage: /giveabilityitem <player> <fly|heal|speed|god>
    permission: opserver.admin
  enchant:
    description: Apply a custom enchant to the held item.
    usage: /enchant <enchant_name> <level>
    permission: opserver.enchant
  enchantlist:
    description: List all custom enchants.
    usage: /enchantlist
  farmworld:
    description: Teleport to the farm world.
    usage: /farmworld [reset]
  daily:
    description: Claim your daily reward.
    usage: /daily
  rank:
    description: Show your rank or purchase the next rank up.
    usage: /rank [buy|player]
  kit:
    description: Claim a kit.
    usage: /kit <name>
  kitlist:
    description: List available kits.
    usage: /kitlist
  stats:
    description: Show player statistics.
    usage: /stats [player]
  job:
    description: Manage your job/profession.
    usage: /job [name]
    aliases: [beruf, jobs]
  jobstats:
    description: Show job statistics.
    usage: /jobstats [player]
  jobtop:
    description: Top players for a job.
    usage: /jobtop [job]
  trophies:
    description: View your trophies.
    usage: /trophies [player]
    aliases: [pokale, pokal]
  mining:
    description: Set your area mining size (1x1 to 7x7).
    usage: /mining [1|3|5|7]
    aliases: [mine, abbau]
  markt:
    description: Spieler-Markt zum Kaufen und Verkaufen.
    usage: /markt [sell|remove|list|search]
    aliases: [market, shop]
  ah:
    description: Auktionshaus - biete auf Items von anderen Spielern.
    usage: /ah [sell|cancel|list|collect]
    aliases: [auktion, auktionshaus]
  home:
    description: Teleportiere zu deinem Home.
    usage: /home [name]
    aliases: [h]
  sethome:
    description: Setze ein Home.
    usage: /sethome [name]
  delhome:
    description: Lösche ein Home.
    usage: /delhome [name]
  spawn:
    description: Teleportiere zum Spawn.
    usage: /spawn
  setspawn:
    description: Setze den Spawn.
    usage: /setspawn
    permission: opserver.admin
  warp:
    description: Teleportiere zu einem Warp.
    usage: /warp [name]
    aliases: [warps]
  setwarp:
    description: Setze einen Warp.
    usage: /setwarp <name>
    permission: opserver.admin
  delwarp:
    description: Lösche einen Warp.
    usage: /delwarp <name>
    permission: opserver.admin
  pwarp:
    description: Player-Warps verwalten und nutzen.
    usage: /pwarp [set|del|list|name]
  tpa:
    description: Sende eine Teleport-Anfrage.
    usage: /tpa <player>
  tpaccept:
    description: Akzeptiere eine Teleport-Anfrage.
    usage: /tpaccept
    aliases: [tpyes]
  tpdeny:
    description: Lehne eine Teleport-Anfrage ab.
    usage: /tpdeny
    aliases: [tpno]
  back:
    description: Teleportiere zum letzten Standort.
    usage: /back
    aliases: [b]
  repair:
    description: Repair the item in your hand or all items in inventory.
    usage: /repair [all]
    permission: opserver.admin
  hat:
    description: Wear the item in your hand as a helmet.
    usage: /hat
  feed:
    description: Fill your hunger bar.
    usage: /feed [player]
    permission: opserver.admin
  heal:
    description: Restore your health to maximum.
    usage: /heal [player]
    permission: opserver.admin
  fly:
    description: Toggle flight mode.
    usage: /fly [player]
    permission: opserver.admin
  speed:
    description: Set walk or fly speed on a 1-10 scale.
    usage: /speed <1-10> [player]
    permission: opserver.admin
  god:
    description: Toggle god mode (invincibility).
    usage: /god [player]
    permission: opserver.admin
  vanish:
    description: Toggle vanish (invisible to other players).
    usage: /vanish [player]
    aliases: [v]
    permission: opserver.admin
  nick:
    description: Set or reset your display name. Use & for color codes.
    usage: /nick <name|off>
    permission: opserver.admin
  seen:
    description: Show when a player was last online.
    usage: /seen <player>
  ping:
    description: Show your ping or another player's ping in ms.
    usage: /ping [player]
  trash:
    description: Open a trash can inventory (items are deleted on close).
    usage: /trash
    aliases: [muelleimer]
  msg:
    description: Send a private message to another player.
    usage: /msg <player> <message>
    aliases: [tell, pm, dm]
  r:
    description: Reply to the last private message you received.
    usage: /r <message>
    aliases: [reply]
  cf:
    description: Setze Coins beim Münzwurf.
    usage: /cf <amount>
    aliases: [coinflip, muenzwurf]
  jackpot:
    description: Beteilige dich am Jackpot oder zeige Infos.
    usage: /jackpot <amount>
  duel:
    description: Fordere einen Spieler zum Duell heraus.
    usage: /duel <player> [amount]
  trade:
    description: Starte einen Handel mit einem Spieler.
    usage: /trade <player>
  report:
    description: Melde einen Spieler.
    usage: /report <player> <reason>
  helpop:
    description: Sende eine Nachricht an alle OPs.
    usage: /helpop <message>
    aliases: [ac]
  clan:
    description: Clan-System verwalten.
    usage: /clan <create|invite|join|leave|kick|disband|info|list|chat>
    aliases: [clans, guild]
  cc:
    description: Schreibe im Clan-Chat.
    usage: /cc <message>
    aliases: [clanchat]
  kristalle:
    description: Zeigt dein Kristall-Guthaben.
    usage: /kristalle [player]
    aliases: [crystals, kr]
  givekristalle:
    description: Gibt einem Spieler Kristalle.
    usage: /givekristalle <player> <amount>
    permission: opserver.admin
  givecrate:
    description: Gibt einem Spieler eine Loot-Kiste.
    usage: /givecrate <player> <type> [amount]
    permission: opserver.admin
  signieren:
    description: Signiert das gehaltene Item mit einem Text.
    usage: /signieren <text>
  itemeffekt:
    description: Gibt einem Item einen passiven Effekt.
    usage: /itemeffekt <effekt> <stufe> [hand|offhand|both]
  ve:
    description: Vanilla Enchant bis Stufe 200 auf gehaltenes Item setzen.
    usage: /ve <enchant> <stufe>
    aliases: [vanillaenchant]
    permission: opserver.admin
  plot:
    description: Plot-System verwalten.
    usage: /plot <auto|home|info|trust|untrust|buy>
    aliases: [grundstueck]
  shop:
    description: Öffnet den Server-Shop.
    usage: /shop
    aliases: [markt2, kaufen]
  vmagnetfilter:
    description: Setzt den Behalten-Filter des Verkaufs-Magneten.
    usage: /vmagnetfilter [item|clear]
    aliases: [sellmagnetfilter]
  perks:
    description: Zeige deine aktiven Perks.
    usage: /perks [give <spieler> <perk>]
  rang:
    description: Setze den Rang eines Spielers.
    usage: /rang <spieler> <rang>
    permission: opserver.admin

permissions:
  opserver.giveitem:
    description: Allows giving custom items.
    default: op
  opserver.enchant:
    description: Allows applying custom enchants.
    default: op
  opserver.farmworld.reset:
    description: Allows resetting the farm world.
    default: op
  opserver.kit.vip:
    description: Access to the VIP kit.
    default: false
  opserver.kit.god:
    description: Access to the GOD kit.
    default: op
  opserver.admin:
    description: Full admin access.
    default: op
    children:
      opserver.giveitem: true
      opserver.enchant: true
      opserver.farmworld.reset: true
      opserver.kit.vip: true
      opserver.kit.god: true
  opserver.job.switch:
    description: Allow switching jobs.
    default: true
